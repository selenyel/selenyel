    <text x="18" y="26" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">UI/UX Designer &amp; Front-End Developer</text>
    <text x="18" y="46" fill="#0284c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">OneWell</text>
    <text x="18" y="68" fill="#526071" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">Design and engineer the unified interface layer across</text>
    <text x="18" y="84" fill="#526071" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">watchOS, iOS, Android, and Web. Own component systems,</text>
    <text x="18" y="100" fill="#526071" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">WCAG 2.1 AA accessibility, and API contracts under shift.</text>
