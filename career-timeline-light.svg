    <text x="18" y="46" fill="#059669" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Ministry of Commerce • ESBIS &amp; Consumer Portal</text>
    <text x="18" y="68" fill="#526071" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400">Led front-end architecture for two national government web</text>
