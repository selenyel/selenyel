<svg xmlns="http://www.w3.org/2000/svg" width="880" height="860" viewBox="0 0 880 860">
  <defs>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <!-- Card Clip Path for Rounded Iridescent Sheen -->
    <clipPath id="cardClip">
      <rect width="390" height="136" rx="16"/>
    </clipPath>
    <!-- Soft Pale Rainbow Iridescent Gradient -->
    <linearGradient id="rainbowSheen" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0"/>
      <stop offset="18%" stop-color="#f43f5e" stop-opacity="0.09"/>
      <stop offset="35%" stop-color="#fbbf24" stop-opacity="0.11"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.13"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.13"/>
      <stop offset="82%" stop-color="#c084fc" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <!-- Drifting Ambient Spotlight (Simulating mouse-light mesh) -->
    <radialGradient id="ambientGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.064"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.11"/>
      <stop offset="45%" stop-color="#059669" stop-opacity="0.044"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Ambient Drifting Spotlight Lights -->
  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="440 180; 530 330; 350 490; 520 670; 390 380; 440 180"
      dur="18s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
    />
    <circle cx="0" cy="0" r="330" fill="url(#ambientGlow1)"/>
  </g>
  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
