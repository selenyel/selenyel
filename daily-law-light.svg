<svg xmlns="http://www.w3.org/2000/svg" width="432" height="204" viewBox="0 0 432 204">
  <defs>
    <filter id="lawShadow" x="-5%" y="-5%" width="110%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <a href="https://lawsofux.com/fittss-law/" target="_blank">
    <rect x="4" y="4" width="424" height="194" rx="16" fill="#ffffff" fill-opacity="0.90" stroke="#e2e8f0" stroke-width="1" filter="url(#lawShadow)"/>
    <line x1="24" y1="5.5" x2="408" y2="5.5" stroke="rgba(255, 255, 255, 0.95)" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="22" y="20" width="220" height="18" rx="9" fill="rgba(2, 132, 199, 0.08)" stroke="rgba(2, 132, 199, 0.25)" stroke-width="1"/>
    <text x="30" y="33" fill="#0284c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="1">UX HEURISTIC • INTERACTION KINETICS</text>
    <text x="22" y="62" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">Fitts's Law</text>
    <rect x="22" y="72" width="250" height="22" rx="6" fill="rgba(15, 23, 42, 0.04)"/>
    <text x="30" y="87" fill="#0284c7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">T = a + b · log₂(2D / W)</text>
    <text x="22" y="116" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Target acquisition time depends on distance &amp; size.</text>
    <text x="22" y="134" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400">✦ Touch targets min 44×44pt; pin high-frequency</text>
    <text x="22" y="150" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400">  actions to viewport edges or thumb-zones.</text>
    <text x="22" y="180" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.5">Nielsen Norman Group &amp; HCI Archive</text>
    <text x="410" y="180" text-anchor="end" fill="#6b5b85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" letter-spacing="0.3">click to learn more &#8250;</text>
    <g transform="translate(370, 56)"><circle cx="0" cy="0" r="16" fill="rgba(2, 132, 199, 0.08)" stroke="#0284c7" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="0" cy="0" r="4.5" fill="#0284c7"/><line x1="-34" y1="0" x2="-18" y2="0" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="2 2"/><text x="-26" y="-5" fill="#0284c7" font-size="8" font-weight="700" text-anchor="middle">D</text><text x="0" y="26" fill="#0284c7" font-size="7.5" font-weight="600" text-anchor="middle">W ≥ 44pt</text></g>
  </a>
</svg>